<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Telegram Link</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e1424; --card:#161f35; --gold:#229ed9; --text:#f4f1e8; --muted:#9fb3c4; --ok:#3ecf7a; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font-family:'Hind Siliguri',system-ui,sans-serif; }
  .card { width:100%; max-width:460px; background:var(--card); border:1px solid #ffffff1a; border-radius:18px; padding:28px; }
  h1 { margin:0 0 6px; font-size:22px; color:var(--gold); }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; margin:14px 0 6px; color:var(--muted); }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #ffffff26; background:#0a0f1c;
          color:var(--text); font-size:15px; font-family:inherit; }
  input:focus { outline:2px solid var(--gold); border-color:transparent; }
  button { margin-top:18px; width:100%; padding:13px; border:0; border-radius:10px; background:var(--gold);
           color:#fff; font-weight:700; font-size:16px; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:14px; font-size:14px; min-height:20px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .current { margin-top:20px; padding:12px; border-radius:10px; background:#0a0f1c; font-size:13px; word-break:break-all; }
  .current a { color:var(--gold); }
  .hidden { display:none; }
  input { font-size:16px; } /* prevents iPhone zoom on focus */
  @media (max-width: 480px) { .card { padding:20px 16px; border-radius:14px; } h1 { font-size:20px; } }
  .row { display:flex; gap:8px; } .row button { margin-top:10px; }
  .ghost { background:transparent; color:var(--muted); border:1px solid #ffffff26; }
  .toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px;
            padding:14px; border-radius:12px; background:#0a0f1c; border:1px solid #ffffff1a; }
  .toggle .t { font-weight:600; } .toggle .s { font-size:13px; color:var(--muted); margin-top:2px; }
  .switch { position:relative; width:56px; height:30px; flex:none; }
  .switch input { opacity:0; width:0; height:0; position:absolute; }
  .slider { position:absolute; inset:0; border-radius:999px; background:#4a5a68; cursor:pointer; transition:.2s; }
  .slider::before { content:''; position:absolute; width:24px; height:24px; left:3px; top:3px; border-radius:50%; background:#fff; transition:.2s; }
  .switch input:checked + .slider { background:var(--ok); }
  .switch input:checked + .slider::before { transform:translateX(26px); }
  .switch input:focus-visible + .slider { outline:2px solid var(--gold); outline-offset:2px; }
  .switch input:disabled + .slider { opacity:.6; cursor:wait; }
</style>
</head>
<body>
<div class="card">
  <!-- Login -->
  <div id="loginBox">
    <h1>🔒 Admin Login</h1>
    <p class="sub">Telegram চ্যানেল লিংক পরিবর্তন করতে পাসওয়ার্ড দিন</p>
    <label for="pw">পাসওয়ার্ড</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="loginBtn">লগইন</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Editor -->
  <div id="editBox" class="hidden">
    <h1>Telegram লিংক</h1>
    <p class="sub">সেভ করলে সাথে সাথে ল্যান্ডিং পেজে কাজ করবে।</p>

    <div class="toggle">
      <div>
        <div class="t">অটো Join (Auto-redirect): <span id="autoLabel">—</span></div>
        <div class="s">ON = ৩ সেকেন্ড পর নিজে থেকেই Telegram চ্যানেলে যাবে<br>OFF = শুধু বাটনে ক্লিক করলে যাবে</div>
      </div>
      <label class="switch" aria-label="Auto-redirect on/off">
        <input type="checkbox" id="auto">
        <span class="slider"></span>
      </label>
    </div>
    <div class="msg" id="autoMsg" style="margin-top:-12px;margin-bottom:8px"></div>

    <label for="link">Telegram চ্যানেল লিংক</label>
    <input id="link" type="url" placeholder="https://t.me/tradepoint_global">
    <button id="saveBtn">সেভ করুন</button>
    <div class="msg" id="saveMsg"></div>
    <div class="current">
      এখন ল্যান্ডিং পেজে চলছে:<br>
      <a id="cur" href="#" target="_blank" rel="noopener">—</a>
    </div>
    <div class="row">
      <button class="ghost" onclick="window.open('/','_blank')">ল্যান্ডিং পেজ দেখুন</button>
      <button class="ghost" id="logoutBtn">লগআউট</button>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let pw = '';
  try { pw = sessionStorage.getItem('adm') || ''; } catch {}

  async function api(method, body) {
    const r = await fetch('/api/link', {
      method, headers: { 'x-admin-password': pw, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Error ' + r.status);
    return data;
  }

  function showCurrent(d) {
    $('cur').textContent = d.link || '(এখনো সেট করা হয়নি)';
    $('cur').href = d.link || '#';
    $('link').value = d.link || '';
  }

  async function login() {
    $('loginBtn').disabled = true; $('loginMsg').textContent = '';
    try {
      const d = await api('GET');
      try { sessionStorage.setItem('adm', pw); } catch {}
      $('loginBox').classList.add('hidden'); $('editBox').classList.remove('hidden');
      showCurrent(d); showAuto(d.auto);
    } catch (e) {
      $('loginMsg').className = 'msg err'; $('loginMsg').textContent = e.message;
      try { sessionStorage.removeItem('adm'); } catch {}
    }
    $('loginBtn').disabled = false;
  }

  $('loginBtn').onclick = () => { pw = $('pw').value; login(); };
  $('pw').onkeydown = (e) => { if (e.key === 'Enter') $('loginBtn').click(); };

  $('saveBtn').onclick = async () => {
    $('saveBtn').disabled = true; $('saveMsg').textContent = '';
    try {
      const d = await api('POST', { link: $('link').value });
      showCurrent(d);
      $('saveMsg').className = 'msg ok'; $('saveMsg').textContent = '✓ সেভ হয়েছে!';
    } catch (e) {
      $('saveMsg').className = 'msg err'; $('saveMsg').textContent = e.message;
    }
    $('saveBtn').disabled = false;
  };

  function showAuto(on) {
    $('auto').checked = !!on;
    $('autoLabel').textContent = on ? 'ON ✅' : 'OFF ⛔';
    $('autoLabel').style.color = on ? 'var(--ok)' : 'var(--err)';
  }

  $('auto').onchange = async () => {
    const want = $('auto').checked;
    $('auto').disabled = true; $('autoMsg').textContent = '';
    try {
      const { auto } = await api('POST', { auto: want });
      showAuto(auto);
      $('autoMsg').className = 'msg ok'; $('autoMsg').textContent = auto ? '✓ অটো Join চালু হয়েছে' : '✓ অটো Join বন্ধ হয়েছে';
    } catch (e) {
      showAuto(!want);
      $('autoMsg').className = 'msg err'; $('autoMsg').textContent = e.message;
    }
    $('auto').disabled = false;
  };

  $('logoutBtn').onclick = () => { try { sessionStorage.removeItem('adm'); } catch {} location.reload(); };

  if (pw) login();
</script>
</body>
</html>
