<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1424">
<title>TRADEPOINT — অফিসিয়াল Telegram চ্যানেল</title>
<meta name="description" content="TRADEPOINT-এর অফিসিয়াল Telegram চ্যানেলে ফ্রি জয়েন করুন — প্রতিদিনের মার্কেট আপডেট ও ট্রেডিং গাইড।">
<meta property="og:title" content="TRADEPOINT — অফিসিয়াল Telegram চ্যানেল">
<meta property="og:description" content="প্রতিদিনের মার্কেট আপডেট ও ট্রেডিং গাইড — ফ্রি জয়েন করুন।">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.png">
<meta property="og:image" content="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<!-- ===== Facebook / Meta Pixel — নতুন ads account-এর Pixel/Dataset ID এখানে দিন ===== -->
<script>
  // উদাহরণ: var FB_PIXEL_IDS = ['123456789012345'];   (খালি থাকলে Pixel বন্ধ)
  var FB_PIXEL_IDS = [];
  if (FB_PIXEL_IDS.length) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    FB_PIXEL_IDS.forEach(function (id) { fbq('init', id); });
    fbq('track', 'PageView');
  }
</script>

<style>
  :root { --bg:#0e1424; --bg2:#141c30; --blue:#1e88e5; --blue2:#4fa8ff;
          --tg:#229ed9; --tg2:#1b8cc4; --up:#16c784; --text:#eef2f8; --muted:#97a3b8; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg); }
  body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(800px 460px at 50% -10%, #1d3a6b 0%, transparent 62%), linear-gradient(170deg,var(--bg),var(--bg2));
         color:var(--text); font-family:'Hind Siliguri',system-ui,sans-serif; line-height:1.6;
         -webkit-tap-highlight-color:transparent; }
  a { -webkit-touch-callout:none; touch-action:manipulation; }
  .wrap { width:100%; max-width:480px; padding:28px 16px calc(28px + env(safe-area-inset-bottom)); text-align:center; }

  .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:26px; }
  .logo { width:44px; height:44px; border-radius:11px; display:block; box-shadow:0 0 0 1px #ffffff1f, 0 6px 18px #00085680; }
  .brand b { font-size:19px; letter-spacing:.5px; display:block; line-height:1.1; text-align:left; }
  .brand small { font-size:10.5px; letter-spacing:1.6px; color:var(--muted); display:block; text-align:left; }

  .badge { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--blue2); border:1px solid #4fa8ff44;
           background:#1e88e514; padding:5px 14px; border-radius:999px; margin-bottom:16px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--up); animation:live 1.6s infinite; }
  @keyframes live { 0% { box-shadow:0 0 0 0 #16c78488; } 70% { box-shadow:0 0 0 8px #16c78400; } 100% { box-shadow:0 0 0 0 #16c78400; } }

  h1 { font-size:clamp(26px,7.5vw,34px); line-height:1.3; margin:0 0 12px; font-weight:700; }
  h1 span { color:var(--blue2); }
  .lead { color:var(--muted); font-size:17px; margin:0 0 18px; }
  .feats { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:0 0 24px; }
  .feats span { font-size:13.5px; padding:6px 12px; border-radius:999px; background:#ffffff0a; border:1px solid #ffffff17; }

  .cta { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:17px 20px; min-height:58px;
         background:var(--tg); color:#fff; text-decoration:none; font-weight:700; font-size:19px; border-radius:14px;
         box-shadow:0 10px 30px #229ed955; animation:pulse 1.8s infinite; }
  .cta:hover, .cta:active { background:var(--tg2); }
  .cta svg { width:26px; height:26px; flex:none; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.03); } }

  .count { margin-top:12px; font-size:15px; color:var(--muted); min-height:24px; }
  .count b { color:var(--blue2); }

  @media (max-width: 380px) { h1 { font-size:24px; } .lead { font-size:16px; } .cta { font-size:17px; } }
  @media (prefers-reduced-motion: reduce) { .cta, .dot { animation:none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <img class="logo" src="/logo.png" alt="TRADEPOINT" width="44" height="44">
    <div><b>TRADEPOINT</b><small>GLOBAL TRADING PLATFORM</small></div>
  </div>

  <div class="badge"><span class="dot"></span> অফিসিয়াল Telegram চ্যানেল</div>
  <h1>প্রতিদিনের <span>ট্রেডিং আপডেট</span> এখন Telegram-এ</h1>
  <p class="lead">TRADEPOINT-এর অফিসিয়াল ঘোষণা, মার্কেট আপডেট আর ট্রেডিং সিগন্যাল — সবার আগে পেতে এখনই জয়েন করুন।</p>
  <div class="feats"><span>📢 অফিসিয়াল ঘোষণা</span><span>💡 ট্রেডিং স্কিল</span><span>📊 মার্কেট আপডেট</span></div>

  <a class="cta js-join" href="/api/go" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    চ্যানেলে জয়েন করুন
  </a>
  <div class="count" id="count"></div>
</main>

<script>
  // ===== Auto-redirect settings =====
  // ON/OFF admin page থেকে নিয়ন্ত্রণ হয়; এখানে শুধু কত সেকেন্ড পর যাবে
  var AUTO_REDIRECT_SECONDS = 3;

  var countEl = document.getElementById('count');
  var gone = false;

  // manual = user tapped the button → real "Lead" (Meta optimizes on this)
  // auto   = countdown redirect → separate custom event, NOT counted as Lead
  function go(manual) {
    if (gone) return; gone = true;
    try {
      if (window.fbq) {
        if (manual) fbq('track', 'Lead');
        else fbq('trackCustom', 'AutoRedirect');
      }
    } catch (e) {}
    // short delay so the pixel event can send
    setTimeout(function () { window.location.href = '/api/go'; }, 300);
  }

  document.querySelectorAll('.js-join').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); go(true); });
  });

  function startCountdown() {
    var left = AUTO_REDIRECT_SECONDS;
    var tick = function () {
      if (gone) return;
      if (left <= 0) { countEl.textContent = 'Telegram খোলা হচ্ছে…'; go(false); return; }
      countEl.innerHTML = '<b>' + left + '</b> সেকেন্ডের মধ্যে অটোমেটিক চ্যানেলে নিয়ে যাওয়া হবে…';
      left--; setTimeout(tick, 1000);
    };
    tick();
  }

  // Admin page-এর ON/OFF setting পড়ে নাও
  fetch('/api/config', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (c) { if (c.auto && AUTO_REDIRECT_SECONDS > 0) startCountdown(); })
    .catch(function () { /* setting না পেলে শুধু বাটন কাজ করবে */ });
</script>
</body>
</html>
